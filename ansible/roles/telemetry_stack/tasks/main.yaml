---
- name: Ensure telemetry directory exists
  ansible.builtin.file:
    path: "{{ telemetry_stack_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy docker-compose.yml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../otel-collector/docker-compose.yml"
    dest: "{{ telemetry_stack_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Reload telemetry stack

- name: Deploy otel-collector-config.yaml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../otel-collector/otel-collector-config.yaml"
    dest: "{{ telemetry_stack_dir }}/otel-collector-config.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart otel-collector

- name: Deploy victoriametrics-datasource.yaml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../otel-collector/victoriametrics-datasource.yaml"
    dest: "{{ telemetry_stack_dir }}/victoriametrics-datasource.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart grafana

- name: Deploy start-stack.sh secret hydration script
  ansible.builtin.template:
    src: start-stack.sh.j2
    dest: "{{ telemetry_stack_dir }}/start-stack.sh"
    owner: root
    group: root
    mode: "0700"
  notify: Reload telemetry stack

- name: Deploy telemetry-stack systemd service unit
  ansible.builtin.copy:
    src: telemetry-stack.service
    dest: /etc/systemd/system/telemetry-stack.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Reload telemetry stack

- name: Ensure telemetry-stack service is enabled and started
  ansible.builtin.systemd:
    name: telemetry-stack.service
    enabled: true
    state: started
