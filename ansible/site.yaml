---
- name: Configure OTel Collector VM
  hosts: telemetry
  become: true

  vars:
    gcp_project_id: "GCP_PROJECT_ID"
    tunnel_secret_id: "CLOUDFLARE_TUNNEL_SECRET_ID"
    grafana_secret_id: "GRAFANA_ADMIN_PASSWORD_SECRET_ID"
    data_disk_device: "/dev/disk/by-id/google-persistent-data"
    data_mount_path: "/mnt/disks/data"
    telemetry_dir: "/opt/telemetry"
    docker_arch_map:
      x86_64: amd64
      aarch64: arm64

  tasks:
    # --- Persistent Data Disk ---
    - name: Wait for persistent data disk device
      ansible.builtin.wait_for:
        path: "{{ data_disk_device }}"
        state: present
        timeout: 60

    - name: Ensure ext4 filesystem exists on persistent disk
      community.general.filesystem:
        fstype: ext4
        dev: "{{ data_disk_device }}"
        opts: "-m 0 -E lazy_itable_init=0,lazy_journal_init=0"

    - name: Ensure mount point exists
      ansible.builtin.file:
        path: "{{ data_mount_path }}"
        state: directory
        mode: "0755"

    - name: Mount persistent data disk
      ansible.posix.mount:
        path: "{{ data_mount_path }}"
        src: "{{ data_disk_device }}"
        fstype: ext4
        opts: "discard,defaults,nofail"
        passno: "2"
        state: mounted

    - name: Ensure Grafana and VictoriaMetrics data directories exist
      ansible.builtin.file:
        path: "{{ data_mount_path }}/{{ item.dir }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        mode: "0750"
      loop:
        - { dir: "grafana", owner: "472" }
        - { dir: "victoriametrics", owner: "1000" }

    # --- Apt Prerequisites ---
    - name: Install apt prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Remove legacy apt .list files replaced by deb822 .sources
      ansible.builtin.file:
        path: "/etc/apt/sources.list.d/{{ item }}"
        state: absent
      loop:
        - tailscale.list
        - docker.list

    # --- Tailscale ---
    - name: Add Tailscale apt repository
      ansible.builtin.deb822_repository:
        name: tailscale
        types: deb
        uris: https://pkgs.tailscale.com/stable/debian
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: main
        signed_by: "https://pkgs.tailscale.com/stable/debian/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
        state: present

    - name: Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

    - name: Ensure tailscaled service is enabled and running
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started

    - name: Check current Tailscale preferences
      ansible.builtin.command: tailscale debug prefs
      register: tailscale_prefs
      changed_when: false
      check_mode: false

    - name: Ensure Tailscale SSH is enabled
      ansible.builtin.command: tailscale set --ssh
      when: not ((tailscale_prefs.stdout | from_json).RunSSH | default(false))
      changed_when: true

    # --- Docker CE ---
    - name: Add Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/debian
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures: "{{ docker_arch_map[ansible_facts['architecture']] | default('amd64') }}"
        signed_by: https://download.docker.com/linux/debian/gpg
        state: present

    - name: Install Docker CE and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker service is enabled and running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    # --- Telemetry Stack ---
    - name: Ensure telemetry directory exists
      ansible.builtin.file:
        path: "{{ telemetry_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy docker-compose.yml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../otel-collector/docker-compose.yml"
        dest: "{{ telemetry_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"
      notify: Reload telemetry stack

    - name: Deploy otel-collector-config.yaml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../otel-collector/otel-collector-config.yaml"
        dest: "{{ telemetry_dir }}/otel-collector-config.yaml"
        owner: root
        group: root
        mode: "0644"
      notify: Restart otel-collector

    - name: Deploy victoriametrics-datasource.yaml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../otel-collector/victoriametrics-datasource.yaml"
        dest: "{{ telemetry_dir }}/victoriametrics-datasource.yaml"
        owner: root
        group: root
        mode: "0644"
      notify: Restart grafana

    - name: Deploy start-stack.sh secret hydration script
      ansible.builtin.template:
        src: templates/start-stack.sh.j2
        dest: "{{ telemetry_dir }}/start-stack.sh"
        owner: root
        group: root
        mode: "0700"
      notify: Reload telemetry stack

    - name: Deploy telemetry-stack systemd service unit
      ansible.builtin.copy:
        src: files/telemetry-stack.service
        dest: /etc/systemd/system/telemetry-stack.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Reload telemetry stack

    - name: Ensure telemetry-stack service is enabled and started
      ansible.builtin.systemd:
        name: telemetry-stack.service
        enabled: true
        state: started

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Reload telemetry stack
      ansible.builtin.systemd:
        name: telemetry-stack.service
        state: reloaded

    - name: Restart otel-collector
      ansible.builtin.command:
        cmd: docker compose restart otel-collector
        chdir: "{{ telemetry_dir }}"
      changed_when: true

    - name: Restart grafana
      ansible.builtin.command:
        cmd: docker compose restart grafana
        chdir: "{{ telemetry_dir }}"
      changed_when: true
